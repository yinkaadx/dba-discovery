[project]
name = "dba-discovery"
version = "0.1.0"
description = "Read only discovery for PostgreSQL and MySQL or MariaDB: evidence collectors, findings rules, a wiki report and a platform inventory, packaged with a Claude skill set"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1", "PyMySQL>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dba-discovery = "discovery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
